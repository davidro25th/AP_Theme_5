syntax = "proto3";

option csharp_namespace = "AP_Theme_5.GrpcProtos";

package GrpcProtos;

message GetRequest{
	string id = 1;
}

message DeleteRequest{
	string id = 1;
}

enum Priority{
	Low = 0;
	Medium = 1;
	High = 2;
}

message AlarmConfigurattion{
	Priority priority = 1;
	double outOfRange = 2;
	string variableID = 3;
	string variableName = 4;
	string variableCode = 5;
	string muid = 6;
	string muunittype = 7;
	string muunitname = 8;

}